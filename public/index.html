  <main class="auth-main" id="auth-main">
    <div class="auth-panel" id="card-tilt" data-step="role">
      <section class="role-picker" id="role-picker" aria-labelledby="role-title">
        <h1 class="role-title" id="role-title">Log in to ClassNest</h1>
        <div class="role-grid">
          <button class="role-card lift" type="button" data-role="admin" aria-pressed="false">
            <span class="role-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 5 6v5c0 4.5 3 8 7 10 4-2 7-5.5 7-10V6z"/><path d="m9 12 2 2 4-4"/></svg></span>
            <strong>Admin</strong>
            <span class="role-note">Manage batches and students</span>
          </button>
          <button class="role-card lift" type="button" data-role="student" aria-pressed="true">
            <span class="role-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m2 9 10-5 10 5-10 5z"/><path d="M6 11v5c2 2 10 2 12 0v-5"/></svg></span>
            <strong>Student</strong>
            <span class="role-note">Join classes and hand in work</span>
          </button>
        </div>
        <p class="auth-note">Students can't sign up. Your admin creates your login.</p>
      </section>

      <section class="card auth-card" id="login-card">
        <div class="auth-card-top">
          <button class="back-link" type="button" id="role-back">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
            Back
          </button>
          <span class="chip chip-role" id="login-role">Student</span>
        </div>

        <div class="auth-head">
          <h2>Welcome back</h2>
          <p class="muted" id="login-hint">Your username and password come from your admin.</p>
        </div>

        <!-- login.js puts the chosen role's form here, and removes it again on Back -->
        <div class="login-form-slot" id="login-form-slot"></div>

        <div class="auth-note">
          <p>Students can't sign up. Your admin creates your login.</p>
          <button class="text-link" type="button" id="preview-error">Preview error state</button>
        </div>
      </section>
    </div>
  </main>
