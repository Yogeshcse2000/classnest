<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in · ClassNest</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">

  <script src="/js/theme.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body class="auth-page">
  <button class="icon-btn" type="button" data-theme-toggle aria-label="Switch colour theme">
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>

  <main class="card auth-card" id="login-card">
    <div class="auth-head">
      <span class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="currentColor"/><path d="M7 15h18a9 8 0 0 1-18 0Z" fill="#fff"/><circle cx="13" cy="12" r="3" fill="#fff"/><circle cx="19.5" cy="11.5" r="3" fill="#fff" opacity=".7"/></svg>
        ClassNest
      </span>
      <h1>Welcome back</h1>
      <p class="muted">Sign in to continue to your classes.</p>
    </div>

    <div class="segmented" role="group" aria-label="Sign in as">
      <span class="segmented-pill" id="role-pill" aria-hidden="true"></span>
      <button type="button" data-role="admin" aria-pressed="false">Admin</button>
      <button type="button" data-role="student" aria-pressed="true">Student</button>
    </div>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="identifier" id="identifier-label">Username</label>
        <input id="identifier" name="identifier" type="text" autocomplete="username" placeholder="e.g. priya.sharma" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Your password" required>
      </div>

      <p class="alert alert-error" id="login-error" role="alert" hidden></p>

      <button class="btn btn-primary btn-block" type="submit" id="login-button">Sign in</button>
    </form>

    <p class="auth-hint" id="login-hint">Your username and password come from your admin.</p>
  </main>

  <script src="/js/animations.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
