<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>Log in · ClassNest</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://api.fontshare.com">
  <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/style.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
    // Keep the screen black until the intro takes over, so the login doesn't flash first.
    // If the intro never starts (for example its file fails to load), the page still appears after 3 seconds.
    if (window.gsap && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      document.documentElement.classList.add('intro-pending');
      setTimeout(function () {
        document.documentElement.classList.remove('intro-pending');
      }, 3000);
    }
  </script>
</head>
<body class="auth-page" data-accent="neutral">
  <header class="auth-brand" id="auth-brand">
    <div class="logo">
      <!-- The logo, drawn in code: a nest of four parallel lines with a swallow rising out of it.
           The small version is in sidebar.js and the favicons. The bird's two ids are only used by the opening. -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 178" class="logo-nest" id="logo-nest" aria-hidden="true">
        <defs>
          <linearGradient id="logo-wipe-edge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--black)"/><stop offset=".1" stop-color="var(--white)"/></linearGradient>
          <mask id="logo-bird-reveal" maskUnits="userSpaceOnUse" x="0" y="0" width="240" height="178"><rect id="logo-bird-wipe" x="0" y="-30" width="240" height="340" fill="url(#logo-wipe-edge)"/></mask>
        </defs>
        <g fill="none" stroke="var(--mark)" stroke-width="5" stroke-linecap="round">
          <path d="M24 82Q120 150 216 82"/>
          <path d="M38 105.2Q120 154.8 202 105.2"/>
          <path d="M56 128.9Q120 159.1 184 128.9"/>
          <path d="M78 151.5Q120 164.5 162 151.5"/>
        </g>
        <g mask="url(#logo-bird-reveal)">
          <g class="mark-bird" id="logo-bird"><path fill="var(--mark-bird)" transform="translate(124 56) rotate(-58) scale(3.5)" d="M9 0C7-1 5-1.25 4-1.25 5-6 1-11.5-7-14-2.5-9-.5-4-2.5-1Q-7-.9-13-4-8.5-.7-7.5 0-8.5.7-13 4-7 .9-2.5 1C-.5 4-2.5 9-7 14 1 11.5 5 6 4 1.25 5 1.25 7 1 9 0Z"/></g>
        </g>
      </svg>
      <!-- The opening starts this part large, in the middle of the whole screen -->
      <div class="logo-name" id="logo-name">
        <p class="logo-word" id="logo-word">
          <span class="visually-hidden">ClassNest</span>
          <span class="word-letters" aria-hidden="true"><span>C</span><span>L</span><span>A</span><span>S</span><span>S</span><span>N</span><span>E</span><span>S</span><span>T</span></span>
          <span class="word-sweep" aria-hidden="true"><span class="word-sweep-text">CLASSNEST</span></span>
          <span class="word-flow" aria-hidden="true"><span></span></span>
        </p>
        <span class="logo-line" id="logo-line"></span>
        <p class="logo-tagline" id="logo-tagline">LEARN · GROW · FLY</p>
      </div>
    </div>
    <canvas class="flock" id="flock" aria-hidden="true"></canvas>
  </header>

  <main class="auth-main" id="auth-main">
    <div class="auth-panel" id="card-tilt" data-step="role">
      <section class="role-picker" id="role-picker" aria-labelledby="role-title">
        <h1 class="role-title" id="role-title">Log in to ClassNest</h1>
        <div class="role-grid">
          <button class="role-card lift" type="button" data-role="admin" aria-pressed="false">
            <span class="role-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 5 6v5c0 4.5 3 8 7 10 4-2 7-5.5 7-10V6z"/><path d="m9 12 2 2 4-4"/></svg></span>
            <strong>Admin</strong>
            <span class="role-note">Manage batches and students</span>
          </button>
          <button class="role-card lift" type="button" data-role="student" aria-pressed="true">
            <span class="role-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m2 9 10-5 10 5-10 5z"/><path d="M6 11v5c2 2 10 2 12 0v-5"/></svg></span>
            <strong>Student</strong>
            <span class="role-note">Join classes and hand in work</span>
          </button>
        </div>
        <p class="auth-note">Students can't sign up. Your admin creates your login.</p>
      </section>

      <section class="card auth-card" id="login-card">
        <div class="auth-card-top">
          <button class="btn btn-ghost" type="button" id="role-back">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
            Back
          </button>
          <span class="chip chip-role" id="login-role">Student</span>
        </div>

        <div class="auth-head">
          <h2>Welcome back</h2>
          <p class="muted" id="login-hint">Your username and password come from your admin.</p>
        </div>

        <!-- login.js puts the chosen role's form here, and removes it again on Back -->
        <div class="login-form-slot" id="login-form-slot"></div>

        <div class="auth-note">
          <p>Students can't sign up. Your admin creates your login.</p>
          <button class="text-link" type="button" id="preview-error">Preview error state</button>
        </div>
      </section>
    </div>
  </main>

  <script src="/js/animations.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
  <script src="/js/login-roles.js"></script>
  <script src="/js/login-flock.js"></script>
  <script src="/js/login-intro.js"></script>
</body>
</html>
