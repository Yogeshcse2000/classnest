<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My dashboard · ClassNest</title>
  <link rel="icon" href="/favicon-student.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://api.fontshare.com">
  <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/style.css">

  <script src="/js/theme.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body class="app">
  <div class="ambient" aria-hidden="true">
    <div class="ambient-glow ambient-glow-a"></div>
    <div class="ambient-glow ambient-glow-b"></div>
  </div>

  <script src="/js/sidebar.js"></script>

  <main class="page">
    <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
<section class="page-head">
      <div>
        <p class="eyebrow" id="hello">&nbsp;</p>
        <h1>Your classroom</h1>
      </div>
    </section>

    <article class="card lift hero-card" id="live-card">
      <div id="live-body" aria-live="polite" aria-busy="true">
        <span class="skeleton sk-title"></span>
        <span class="skeleton sk-line sk-short"></span>
      </div>
    </article>

    <section class="panels fill">
      <article class="card panel">
        <div class="panel-head">
          <h2>Upcoming lectures</h2>
        </div>
        <ul class="rows" id="upcoming-list" aria-busy="true">
          <li class="row-card"><div class="row-main"><span class="skeleton sk-line"></span><span class="skeleton sk-line sk-short"></span></div></li>
          <li class="row-card"><div class="row-main"><span class="skeleton sk-line"></span><span class="skeleton sk-line sk-short"></span></div></li>
        </ul>
      </article>

      <article class="card panel">
        <div class="panel-head">
          <h2>Assignments</h2>
          <a class="text-link" href="/student/assignments">Open all</a>
        </div>
        <ul class="rows" id="assignment-list" aria-busy="true">
          <li class="row-card"><div class="row-main"><span class="skeleton sk-line"></span><span class="skeleton sk-line sk-short"></span></div></li>
          <li class="row-card"><div class="row-main"><span class="skeleton sk-line"></span><span class="skeleton sk-line sk-short"></span></div></li>
        </ul>
      </article>
    </section>
  </main>

  <script src="/js/animations.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/palette.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/student.js"></script>
</body>
</html>
