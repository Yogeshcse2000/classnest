<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignments · ClassNest</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">

  <script src="/js/theme.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body class="app">
  <div class="ambient" aria-hidden="true">
    <div class="ambient-glow ambient-glow-a"></div>
    <div class="ambient-glow ambient-glow-b"></div>
  </div>

  <script src="/js/sidebar.js"></script>

  <main class="page">
<section class="page-head">
      <h1>Assignments</h1>
      <div class="page-actions">
        <button class="btn btn-primary" type="button" id="assignment-new">+ New assignment</button>
      </div>
    </section>

    <div class="split fill">
      <section class="stack">
        <div class="field filter-field">
          <label class="visually-hidden" for="assignment-filter">Show assignments for</label>
          <select id="assignment-filter">
            <option value="">All batches</option>
          </select>
        </div>
        <p class="visually-hidden" id="assignment-count"></p>
        <ul class="rows" id="assignment-list" aria-busy="true">
          <li class="row-card"><div class="row-main"><span class="skeleton sk-line"></span><span class="skeleton sk-line sk-short"></span></div></li>
          <li class="row-card"><div class="row-main"><span class="skeleton sk-line"></span><span class="skeleton sk-line sk-short"></span></div></li>
          <li class="row-card"><div class="row-main"><span class="skeleton sk-line"></span><span class="skeleton sk-line sk-short"></span></div></li>
        </ul>
      </section>

      <section class="card panel detail" id="detail">
        <div class="empty-state" id="detail-empty" hidden>
          <div class="empty-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 2h6v4H9zM9 12h6M9 16h4"/></svg></div>
          <h2>Pick an assignment</h2>
          <p>Its students and their work will show up here.</p>
        </div>

        <div class="stack" id="detail-content" hidden>
          <div class="detail-head">
            <div class="detail-heading">
              <p class="eyebrow" id="detail-batch"></p>
              <h2 class="detail-title" id="detail-title"></h2>
              <p class="detail-due" id="detail-due"></p>
            </div>
            <div class="row-buttons" id="detail-buttons"></div>
          </div>
          <p class="full-text" id="detail-description"></p>

          <div class="pills" role="group" aria-label="Filter students by status">
            <button class="pill" type="button" data-filter="all" aria-pressed="true">All <span id="pill-all"></span></button>
            <button class="pill" type="button" data-filter="Submitted" aria-pressed="false">On time <span id="pill-ontime"></span></button>
            <button class="pill" type="button" data-filter="Late" aria-pressed="false">Late <span id="pill-late"></span></button>
            <button class="pill" type="button" data-filter="Not submitted" aria-pressed="false">Missing <span id="pill-missing"></span></button>
          </div>

          <table class="table">
            <caption class="visually-hidden">Each student's work on this assignment</caption>
            <thead>
              <tr>
                <th scope="col">Student</th>
                <th scope="col">File</th>
                <th scope="col">Status</th>
                <th scope="col"><span class="visually-hidden">Download</span></th>
              </tr>
            </thead>
            <tbody id="roster-rows" aria-busy="true">
              <tr><td colspan="4"><span class="skeleton sk-line"></span></td></tr>
              <tr><td colspan="4"><span class="skeleton sk-line"></span></td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </div>

    <dialog class="dialog form-dialog" id="assignment-dialog" aria-labelledby="assignment-form-title">
      <section class="card form-card" id="assignment-form-card">
        <h2 id="assignment-form-title">Post an assignment</h2>
        <form id="assignment-form" novalidate>
          <div class="field">
            <label for="assignment-title">Title</label>
            <input id="assignment-title" type="text" maxlength="120" autocomplete="off" placeholder="e.g. Build a landing page" aria-describedby="assignment-title-error" required>
            <p class="field-error" id="assignment-title-error" hidden></p>
          </div>
          <div class="field">
            <label for="assignment-description">Description</label>
            <textarea id="assignment-description" maxlength="2000" placeholder="What should students do and hand in?" aria-describedby="assignment-description-error" required></textarea>
            <p class="field-error" id="assignment-description-error" hidden></p>
          </div>
          <div class="field">
            <label for="assignment-deadline">Deadline <span class="optional">(IST)</span></label>
            <input id="assignment-deadline" type="text" data-picker="datetime" data-default-time="23:59" autocomplete="off" aria-describedby="assignment-deadline-error" required>
            <p class="field-error" id="assignment-deadline-error" hidden></p>
          </div>
          <div class="field">
            <label for="assignment-batch">Batch</label>
            <select id="assignment-batch" aria-describedby="assignment-batch-error" required>
              <option value="">Loading batches…</option>
            </select>
            <p class="field-error" id="assignment-batch-error" hidden></p>
          </div>

          <p class="alert alert-error" id="assignment-error" role="alert" hidden></p>

          <button class="btn btn-primary btn-block" type="submit" id="assignment-save">Post assignment</button>
          <button class="btn btn-ghost btn-block" type="button" id="assignment-cancel">Cancel</button>
        </form>
        <button class="icon-btn form-close" type="button" id="assignment-close" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </section>
    </dialog>
  </main>

  <script src="/js/animations.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/palette.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/picker.js"></script>
  <script src="/js/schedule.js"></script>
  <script src="/js/assignments.js"></script>
</body>
</html>
