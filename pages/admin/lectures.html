<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lectures · ClassNest</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/style.css">

  <script src="/js/theme.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body class="app">
  <div class="ambient" aria-hidden="true">
    <div class="ambient-glow ambient-glow-a"></div>
    <div class="ambient-glow ambient-glow-b"></div>
  </div>

  <script src="/js/sidebar.js"></script>

  <main class="page">
<h1 class="visually-hidden">Lectures</h1>

    <div class="split">
      <section class="card form-card" id="lecture-form-card">
        <h2 id="lecture-form-title">Release a lecture</h2>
        <form id="lecture-form" novalidate>
          <div class="field">
            <label for="lecture-title">Title</label>
            <input id="lecture-title" type="text" maxlength="120" autocomplete="off" placeholder="e.g. Intro to JavaScript" aria-describedby="lecture-title-error" required>
            <p class="field-error" id="lecture-title-error" hidden></p>
          </div>
          <div class="field">
            <label for="lecture-time">Date and time <span class="optional">(IST)</span></label>
            <input id="lecture-time" type="text" data-picker="datetime" data-default-time="18:00" autocomplete="off" aria-describedby="lecture-time-error lecture-past" required>
            <p class="field-error" id="lecture-time-error" hidden></p>
            <p class="field-note" id="lecture-past" role="status" hidden>This date and time has already passed. You can still save it.</p>
          </div>
          <div class="field">
            <label for="lecture-link">Google Meet link</label>
            <input id="lecture-link" type="url" maxlength="200" autocomplete="off" placeholder="https://meet.google.com/abc-defg-hij" aria-describedby="lecture-link-error" required>
            <p class="field-error" id="lecture-link-error" hidden></p>
          </div>
          <div class="field">
            <label for="lecture-batch">Batch</label>
            <select id="lecture-batch" aria-describedby="lecture-batch-error" required>
              <option value="">Loading batches…</option>
            </select>
            <p class="field-error" id="lecture-batch-error" hidden></p>
          </div>

          <p class="alert alert-error" id="lecture-error" role="alert" hidden></p>

          <button class="btn btn-primary btn-block" type="submit" id="lecture-save">Release lecture</button>
          <button class="btn btn-ghost btn-block" type="button" id="lecture-cancel" hidden>Cancel</button>
        </form>
      </section>

      <section class="card panel">
        <div class="panel-head">
          <h2>Lectures <span class="count" id="lecture-count"></span></h2>
          <div class="field filter-field">
            <label class="visually-hidden" for="lecture-filter">Show lectures for</label>
            <select id="lecture-filter">
              <option value="">All batches</option>
            </select>
          </div>
        </div>
        <ul class="rows" id="lecture-list" aria-busy="true">
          <li class="row-card"><div class="row-main"><span class="skeleton sk-line"></span><span class="skeleton sk-line sk-short"></span></div></li>
          <li class="row-card"><div class="row-main"><span class="skeleton sk-line"></span><span class="skeleton sk-line sk-short"></span></div></li>
          <li class="row-card"><div class="row-main"><span class="skeleton sk-line"></span><span class="skeleton sk-line sk-short"></span></div></li>
        </ul>
      </section>
    </div>
  </main>

  <script src="/js/animations.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/palette.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/picker.js"></script>
  <script src="/js/schedule.js"></script>
  <script src="/js/lectures.js"></script>
</body>
</html>
