<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Students · ClassNest</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/style.css">

  <script src="/js/theme.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body class="app">
  <div class="ambient" aria-hidden="true">
    <div class="ambient-glow ambient-glow-a"></div>
    <div class="ambient-glow ambient-glow-b"></div>
  </div>

  <script src="/js/sidebar.js"></script>

  <main class="page">
<h1 class="visually-hidden">Students</h1>

    <div class="split">
      <section class="card form-card" id="student-form-card">
        <h2>Enroll a student</h2>
        <form id="student-form" novalidate>
          <div class="field">
            <label for="student-name">Full name</label>
            <input id="student-name" type="text" maxlength="80" autocomplete="off" placeholder="e.g. Priya Nair" required>
          </div>
          <div class="field">
            <label for="student-email">Email</label>
            <input id="student-email" type="email" maxlength="254" autocomplete="off" placeholder="priya@example.com" required>
          </div>
          <div class="field">
            <label for="student-batch">Batch</label>
            <select id="student-batch" required>
              <option value="">Loading batches…</option>
            </select>
          </div>

          <p class="alert alert-error" id="student-error" role="alert" hidden></p>

          <button class="btn btn-primary btn-block" type="submit" id="student-save">Enroll &amp; generate login</button>
        </form>
      </section>

      <section class="stack">
        <!-- Login details for the student just enrolled. Shown once, then wiped. -->
        <article class="card cred-card" id="cred-card" aria-live="polite" hidden>
          <div class="cred-head">
            <svg class="success-check" viewBox="0 0 52 52" aria-hidden="true">
              <circle cx="26" cy="26" r="23" fill="none" stroke="currentColor" stroke-width="3"/>
              <path d="M16 27l7 7 14-15" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <div>
              <h2>Student enrolled!</h2>
              <p id="cred-intro"></p>
            </div>
          </div>
          <div class="cred-rows">
            <div class="cred-row"><span>Username</span><strong class="mono" id="cred-username"></strong></div>
            <div class="cred-row"><span>Temporary password</span><strong class="mono" id="cred-password"></strong></div>
          </div>
          <p class="cred-note">Save or share these now. For safety, the password is only shown this once.</p>
          <div class="cred-actions">
            <button class="btn btn-ghost" type="button" data-copy="username">Copy username</button>
            <button class="btn btn-ghost" type="button" data-copy="password">Copy password</button>
            <button class="btn btn-primary" type="button" data-copy="both">Copy both</button>
            <button class="btn btn-ghost cred-done" type="button" id="cred-done">Done</button>
          </div>
        </article>

        <article class="card panel">
          <div class="panel-head">
            <h2>Students <span class="count" id="student-count"></span></h2>
            <div class="search-field">
              <label class="visually-hidden" for="student-search">Search students</label>
              <input id="student-search" type="search" autocomplete="off" placeholder="Search...">
            </div>
          </div>
          <table class="table">
            <caption class="visually-hidden">All students</caption>
            <thead>
              <tr>
                <th scope="col">Name</th>
                <th scope="col">Email</th>
                <th scope="col">Batch</th>
                <th scope="col">Username</th>
              </tr>
            </thead>
            <tbody id="student-list" aria-busy="true">
              <tr><td colspan="4"><span class="skeleton sk-line"></span></td></tr>
              <tr><td colspan="4"><span class="skeleton sk-line"></span></td></tr>
              <tr><td colspan="4"><span class="skeleton sk-line"></span></td></tr>
            </tbody>
          </table>
        </article>
      </section>
    </div>
  </main>

  <script src="/js/animations.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/palette.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/students.js"></script>
</body>
</html>
