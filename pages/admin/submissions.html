<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Submissions · ClassNest</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">

  <script src="/js/theme.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>
  <div class="ambient" aria-hidden="true">
    <div class="ambient-glow ambient-glow-a"></div>
    <div class="ambient-glow ambient-glow-b"></div>
  </div>

  <header class="topbar">
    <div class="topbar-left">
      <a class="brand" href="/admin/dashboard">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="currentColor"/><path d="M7 15h18a9 8 0 0 1-18 0Z" fill="#fff"/><circle cx="13" cy="12" r="3" fill="#fff"/><circle cx="19.5" cy="11.5" r="3" fill="#fff" opacity=".7"/></svg>
        <span class="brand-text">ClassNest</span>
      </a>
      <span class="role-badge">Admin</span>
    </div>
    <nav class="nav" aria-label="Admin pages">
      <a href="/admin/dashboard">Dashboard</a>
      <a href="/admin/batches">Batches</a>
      <a href="/admin/students">Students</a>
      <a href="/admin/lectures">Lectures</a>
      <a href="/admin/assignments" aria-current="page">Assignments</a>
    </nav>
    <div class="topbar-actions">
      <span class="user-chip">
        <span class="avatar" data-user-initial aria-hidden="true"></span>
        <span class="user-name" data-user-name></span>
      </span>
      <button class="palette-btn" type="button" data-palette-open aria-label="Search" title="Search (Ctrl+K)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <kbd>Ctrl K</kbd>
      </button>
      <button class="icon-btn" type="button" data-theme-toggle aria-label="Switch colour theme">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button class="btn btn-ghost" type="button" data-logout>Log out</button>
    </div>
  </header>

  <main class="page">
    <section class="welcome">
      <a class="back-link page-back" href="/admin/assignments">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        Back to assignments
      </a>
      <p class="eyebrow" id="assignment-batch">Submissions</p>
      <h1 class="page-title" id="assignment-title"><span class="skeleton sk-title"></span></h1>
      <p class="muted" id="assignment-due"></p>
    </section>

    <section class="card empty-state" id="unavailable" hidden>
      <div class="empty-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 2h6v4H9zM9 12h6M9 16h4"/></svg></div>
      <h2>This assignment isn't available</h2>
      <p id="unavailable-text"></p>
      <a class="btn btn-primary" href="/admin/assignments">Back to assignments</a>
    </section>

    <div class="count-grid" id="submission-counts">
      <div class="card count-card">
        <span class="stat-number" id="count-submitted"><span class="skeleton sk-number"></span></span>
        <span class="muted">Submitted</span>
      </div>
      <div class="card count-card">
        <span class="stat-number" id="count-late"><span class="skeleton sk-number"></span></span>
        <span class="muted">Late</span>
      </div>
      <div class="card count-card">
        <span class="stat-number" id="count-missing"><span class="skeleton sk-number"></span></span>
        <span class="muted">Not submitted</span>
      </div>
    </div>

    <section class="card list-card" id="submission-card">
      <table class="table">
        <caption class="visually-hidden">Each student's work on this assignment</caption>
        <thead>
          <tr>
            <th scope="col">Name</th>
            <th scope="col">Username</th>
            <th scope="col">Status</th>
            <th scope="col">Submitted</th>
            <th scope="col"><span class="visually-hidden">Download</span></th>
          </tr>
        </thead>
        <tbody id="submission-rows" aria-busy="true">
          <tr><td colspan="5"><span class="skeleton sk-line"></span></td></tr>
          <tr><td colspan="5"><span class="skeleton sk-line"></span></td></tr>
          <tr><td colspan="5"><span class="skeleton sk-line"></span></td></tr>
        </tbody>
      </table>
    </section>
  </main>

  <script src="/js/animations.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/palette.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/submissions.js"></script>
</body>
</html>
