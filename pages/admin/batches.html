<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Batches · ClassNest</title>
  <link rel="icon" href="/favicon-admin.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://api.fontshare.com">
  <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/style.css">

  <script src="/js/theme.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body class="app">
  <div class="ambient" aria-hidden="true">
    <div class="ambient-glow ambient-glow-a"></div>
    <div class="ambient-glow ambient-glow-b"></div>
  </div>

  <script src="/js/sidebar.js"></script>

  <main class="page">
    <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
<h1 class="visually-hidden">Batches</h1>

    <div class="split">
      <section class="card form-card">
        <h2>New batch</h2>
        <form id="batch-form" novalidate>
          <div class="field">
            <label for="batch-name">Batch name</label>
            <input id="batch-name" type="text" maxlength="80" autocomplete="off" placeholder="e.g. Web Dev · Jan 2027" required>
          </div>
          <div class="field">
            <label for="batch-start">Start date</label>
            <input id="batch-start" type="text" data-picker="date" autocomplete="off" required>
          </div>
          <div class="field">
            <label for="batch-description">Description <span class="optional">(optional)</span></label>
            <textarea id="batch-description" maxlength="500" placeholder="What will this batch learn?"></textarea>
          </div>

          <p class="alert alert-error" id="batch-error" role="alert" hidden></p>

          <button class="btn btn-primary btn-block" type="submit" id="batch-save">Create batch</button>
        </form>
      </section>

      <section class="card panel">
        <div class="panel-head">
          <h2>Batches <span class="count" id="batch-count"></span></h2>
        </div>
        <table class="table">
          <caption class="visually-hidden">All batches</caption>
          <thead>
            <tr>
              <th scope="col">Batch</th>
              <th scope="col">Start</th>
              <th scope="col">Students</th>
              <th scope="col">Lectures</th>
              <th scope="col">Assignments</th>
              <th scope="col"><span class="visually-hidden">Delete</span></th>
            </tr>
          </thead>
          <tbody id="batch-list" aria-busy="true">
            <tr><td colspan="6"><span class="skeleton sk-line"></span></td></tr>
            <tr><td colspan="6"><span class="skeleton sk-line"></span></td></tr>
          </tbody>
        </table>
      </section>
    </div>
  </main>

  <script src="/js/animations.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/palette.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/picker.js"></script>
  <script src="/js/batches.js"></script>
</body>
</html>
